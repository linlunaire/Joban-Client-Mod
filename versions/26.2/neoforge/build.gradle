architectury {
    platformSetupLoomIde()
    neoForge()
}
configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}
dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    api "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
    implementation files(new File(rootProject.mtrRoot, "build/release/MTR-neoforge-${rootProject.mtrVersion}.jar"))
    implementation files(rootProject.transitCoreLoaderJar('neoforge'))
    common(project(':common')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}
processResources {
    from(project(':common').file('src/main/resources')) { include 'jsblock.mixins.json' }
}
