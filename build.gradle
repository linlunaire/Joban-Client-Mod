plugins {
	id "architectury-plugin" version "3.4.164"
	id "dev.architectury.loom" version "1.11.458" apply false
	id "com.gradleup.shadow" version "8.3.0" apply false
}

def minecraftVersion = providers.gradleProperty("minecraft_version").get()
def mtrProject = file(findProperty("mtrProjectDir") ?: "../Minecraft-Transit-Railway-1.21.1")
def mtrPropertiesFile = mtrProject.toPath().resolve("gradle.properties").toFile()
def mtrProperties = new Properties()
if (!mtrPropertiesFile.isFile()) {
	throw new GradleException("MTR source not found at ${mtrProject}. Set -PmtrProjectDir to the Minecraft 1.21.1 checkout.")
}
mtrPropertiesFile.withInputStream { mtrProperties.load(it) }
if (mtrProperties.getProperty("minecraft_version", "1.21.1") != minecraftVersion) {
	throw new GradleException("JCM ${minecraftVersion} cannot use MTR for ${mtrProperties.getProperty('minecraft_version')}.")
}
def mtrVersion = "${minecraftVersion}-${mtrProperties.getProperty("mod_version")}"

ext.minecraftVersion = minecraftVersion
ext.mtrProject = mtrProject
ext.mtrVersion = mtrVersion
ext.mtrCommonDevJar = mtrProject.toPath().resolve("common/build/devlibs/common-${mtrVersion}-dev.jar").toFile()
ext.mtrFabricDevJar = mtrProject.toPath().resolve("fabric/build/devlibs/fabric-${mtrVersion}-dev.jar").toFile()
ext.mtrNeoForgeDevJar = mtrProject.toPath().resolve("forge/build/devlibs/neoforge-${mtrVersion}-dev.jar").toFile()
ext.mtrFabricReleaseJar = mtrProject.toPath().resolve("build/release/MTR-fabric-${mtrVersion}.jar").toFile()
ext.mtrNeoForgeReleaseJar = mtrProject.toPath().resolve("build/release/MTR-neoforge-${mtrVersion}.jar").toFile()

architectury {
	minecraft = minecraftVersion
}

// Loom must be present before Architectury creates the Fabric/NeoForge
// platform configurations. This matches the working MTR and MTR-ANTE setup.
subprojects {
	if (project.name == "neoforge") {
		extensions.extraProperties.set("loom.platform", "neoforge")
	}
	apply plugin: "dev.architectury.loom"
	apply plugin: "com.gradleup.shadow"
}

allprojects {
	apply plugin: "architectury-plugin"
}
